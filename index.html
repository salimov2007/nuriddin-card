<title>Nuriddin Salimov | Digital Card</title>
<meta name="description" content="Nuriddin Salimov — personal digital card, contact information and social links.">
<meta name="keywords" content="Salomov, Nuriddin Salimov, Qakhramon Salomov, Salomov digital card">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b0b0c;
    --bg-1:#141416;
    --bg-2:#1c1b1d;
    --line:#2c2a27;
    --line-soft:#232220;
    --ink-0:#f4f1ea;
    --ink-1:#b6b0a4;
    --ink-2:#726c60;
    --gold-0:#e8cf8a;
    --gold-1:#c9a962;
    --gold-2:#8a6f34;
    --titanium-0:#c4c4c8;
    --titanium-1:#87878e;
    --titanium-2:#3c3c40;
    --gold-card-0:#f3dd9c;
    --gold-card-1:#caa74e;
    --gold-card-2:#7a5c1e;
    --shadow-deep:0 30px 60px -25px rgba(0,0,0,0.75);
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html{ -webkit-tap-highlight-color:transparent; }
  body{
    margin:0;
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 700px 500px at 50% -10%, #201d16 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, #0a0a0b 100%);
    color:var(--ink-0);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 18px 70px;
  }
  .card{
    width:100%;
    max-width:430px;
  }

  /* ---------- Avatar & identity ---------- */
  .avatar-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:8px;
  }
  .avatar-frame{
    position:relative;
    width:158px;
    height:158px;
  }
  .avatar{
    width:158px;
    height:158px;
    border-radius:50%;
    background:linear-gradient(145deg,#232226,#0f0f10);
    padding:4px;
    box-shadow:
      0 0 0 1px rgba(201,169,98,0.35),
      0 0 0 7px rgba(255,255,255,0.02),
      var(--shadow-deep);
    position:relative;
  }
  .avatar-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--line-soft);
    background:#0f0f10;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-inner .placeholder{
    color:var(--ink-2);
    font-size:12.5px;
    text-align:center;
    padding:0 20px;
    line-height:1.5;
  }
  .seal{
    position:absolute;
    right:-4px;
    bottom:-4px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:linear-gradient(150deg, var(--gold-0), var(--gold-2));
    border:2px solid var(--bg-0);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.02em;
    color:#2b220e;
    box-shadow:0 6px 16px -4px rgba(0,0,0,0.6);
  }
  .name .surname,.name .given-name{display:block;}
  .name{
    margin-top:22px;
    font-family:'Cormorant Garamond', serif;
    font-size:38px;
    font-weight:700;
    letter-spacing:.01em;
    text-align:center;
    color:var(--ink-0);
  }
  .divider{
    width:46px;
    height:1px;
    margin:12px auto 12px;
    background:linear-gradient(90deg, transparent, var(--gold-1), transparent);
  }
  .subtitle{
    color:var(--ink-1);
    font-size:12.5px;
    text-align:center;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-weight:500;
  }
  .role{
    margin-top:6px;
    color:var(--gold-1);
    font-size:13.5px;
    text-align:center;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:600;
  }

  /* ---------- Actions ---------- */
  .actions{
    display:flex;
    gap:12px;
    margin:28px 0 30px;
  }
  .btn{
    flex:1;
    padding:16px 10px;
    border-radius:14px;
    text-align:center;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:.02em;
    border:1px solid var(--line);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    color:var(--ink-0);
    background:var(--bg-1);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn.primary{
    background:linear-gradient(135deg, var(--gold-0), var(--gold-1) 55%, var(--gold-2));
    color:#241b08;
    border:none;
    font-weight:700;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:not(.primary):hover{ border-color:var(--gold-2); }

  .section-label{
    color:var(--ink-2);
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    font-weight:600;
    margin:30px 4px 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line-soft);
  }

  /* ---------- Contact rows ---------- */
  .row{
    display:flex;
    align-items:center;
    gap:14px;
    background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border:1px solid var(--line);
    border-radius:15px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  a.row{
    text-decoration:none;
    color:inherit;
    transition:background .15s ease, transform .15s ease, border-color .15s ease;
  }
  a.row:active{ transform:scale(0.98); }
  a.row:hover{ border-color:var(--gold-2); }
  .icon{
    width:40px;
    height:40px;
    border-radius:11px;
    background:var(--bg-2);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:700;
    flex-shrink:0;
    color:var(--gold-1);
  }
  .row-text{ flex:1; min-width:0; }
  .row-label{ color:var(--ink-2); font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px; }
  .row-value{ font-weight:600; font-size:15.5px; letter-spacing:.01em; color:var(--ink-0); }
  .chev{ color:var(--ink-2); font-size:17px; }

  /* ---------- Payment cards ---------- */
  .paycard{
    border-radius:18px;
    padding:22px 22px 20px;
    margin-bottom:10px;
    position:relative;
    overflow:hidden;
    isolation:isolate;
    box-shadow:var(--shadow-deep), inset 0 1px 0 rgba(255,255,255,0.08);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .paycard:active{ transform:scale(0.98); }
  .paycard.visa{ background:linear-gradient(150deg, var(--titanium-0), var(--titanium-2) 65%, #1c1c1e); }
  .paycard.humo{ background:linear-gradient(150deg, var(--gold-card-0), var(--gold-card-1) 55%, var(--gold-card-2)); }

  .paycard::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 5px);
    mix-blend-mode:overlay;
    z-index:0;
  }
  .paycard::after{
    content:"";
    position:absolute;
    top:-60%; left:-30%;
    width:75%; height:220%;
    background:linear-gradient(100deg, transparent 40%, rgba(255,255,255,0.35) 48%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0.35) 52%, transparent 60%);
    transform:rotate(8deg);
    animation:sweep 3.6s ease-in-out infinite;
    animation-delay:var(--sweep-delay, 0s);
    z-index:1;
    pointer-events:none;
  }
  @keyframes sweep{
    0%{ transform:translateX(-40%) rotate(8deg); opacity:0; }
    12%{ opacity:1; }
    35%{ opacity:0; }
    100%{ transform:translateX(160%) rotate(8deg); opacity:0; }
  }
  .paycard.humo::after{ --sweep-delay:1.8s; }

  .paycard > *{ position:relative; z-index:2; }

  .paycard-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
  }
  .paycard-bank{
    font-size:10.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-weight:700;
  }
  .paycard.visa .paycard-bank{ color:#e7e7ea; }
  .paycard.humo .paycard-bank{ color:#3c2c08; }

  .paycard-logo{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:.04em;
    font-style:italic;
  }
  .paycard.visa .paycard-logo{ color:#f5f5f6; }
  .paycard.humo .paycard-logo{ color:#3c2c08; font-style:normal; }

  .chip{
    width:38px;
    height:28px;
    border-radius:6px;
    margin-bottom:18px;
    background:linear-gradient(135deg, #f0e3ba, #b89a4f);
    position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.25);
  }
  .chip::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(0,0,0,0.25);
    border-radius:3px;
  }
  .paycard.humo .chip{
    background:linear-gradient(135deg, #4a4a50, #232326);
  }

  .paycard-number{
    font-family:'JetBrains Mono', monospace;
    font-size:19px;
    font-weight:600;
    letter-spacing:.09em;
    margin-bottom:20px;
    cursor:pointer;
    user-select:none;
  }
  .paycard.visa .paycard-number{ color:#f6f6f7; }
  .paycard.humo .paycard-number{ color:#2e2107; }

  .paycard-bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .paycard-holder-label{ font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:3px; }
  .paycard.visa .paycard-holder-label{ color:#c9c9cd; }
  .paycard.humo .paycard-holder-label{ color:#5c4816; }
  .paycard-holder{ text-transform:uppercase; letter-spacing:.05em; font-weight:700; font-size:13.5px; }
  .paycard.visa .paycard-holder{ color:#fdfdfe; }
  .paycard.humo .paycard-holder{ color:#2e2107; }

  .contactless{
    font-size:18px;
    opacity:.8;
    transform:rotate(90deg);
  }
  .paycard.visa .contactless{ color:#e7e7ea; }
  .paycard.humo .contactless{ color:#3c2c08; }

  .copy-hint{
    font-size:10.5px;
    color:var(--ink-2);
    letter-spacing:.04em;
    margin:0 4px 18px;
  }

  /* ---------- Share & footer ---------- */
  .share{
    margin-top:26px;
    text-align:center;
    padding:16px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--bg-1);
    color:var(--gold-1);
    font-weight:600;
    font-size:14px;
    letter-spacing:.02em;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .share:active{ transform:scale(0.98); }
  .share:hover{ border-color:var(--gold-2); }

  .footer{
    text-align:center;
    margin-top:34px;
    color:var(--ink-2);
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
  }
  .footer span{ color:var(--gold-2); }

  /* ---------- Floating music player ---------- */
  .music-player{
    position:fixed;
    right:10px;
    bottom:24px;
    width:68px;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    pointer-events:none;
  }
  .music-btn{
    width:62px;
    height:62px;
    border-radius:50%;
    border:1px solid rgba(232,207,138,.72);
    background:linear-gradient(145deg,#222124,#0e0e0f);
    color:var(--gold-0);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    line-height:1;
    cursor:pointer;
    pointer-events:auto;
    box-shadow:0 10px 28px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 5px rgba(201,169,98,.08);
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .music-btn:hover{
    background:linear-gradient(145deg,#2b2927,#111112);
    box-shadow:0 12px 32px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 6px rgba(201,169,98,.10);
  }
  .music-btn:active{ transform:scale(.92); }
  .music-btn.playing{
    background:linear-gradient(145deg,#2a2518,#11100d);
    animation:musicPulse 1.35s ease-in-out infinite;
  }
  .music-btn .note{
    transform:translateY(-1px);
    text-shadow:0 0 12px rgba(232,207,138,.35);
  }
  @keyframes musicPulse{
    0%,100%{ box-shadow:0 10px 28px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 5px rgba(201,169,98,.08); }
    50%{ box-shadow:0 12px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 9px rgba(201,169,98,.14); }
  }
  @media (max-width:520px){
    .music-player{ right:8px; bottom:22px; }
    .music-btn{ width:58px; height:58px; font-size:23px; }
  }

  /* Only real interactive elements should advertise interaction. */
  .section-label, .footer, .name, .role, .subtitle, .divider, .avatar-wrap, .copy-hint{
    cursor:default;
    user-select:none;
  }
  .paycard{ cursor:pointer; }
  .btn, a.row, #shareBtn, #musicBtn{ cursor:pointer; }

</style>
<style>
.paycard, .copy-hint { display:none !important; }
</style>

<style>
/* iPhone-style smooth entrance and interaction */
@keyframes iosPageIn { from { opacity:0; transform:translateY(18px) scale(.985); filter:blur(6px); } to { opacity:1; transform:none; filter:blur(0); } }
@keyframes iosFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
@keyframes iosGlow { 0%,100%{box-shadow:0 0 0 0 rgba(232,207,138,0)} 50%{box-shadow:0 0 0 7px rgba(232,207,138,.07)} }
body{overflow-x:hidden;}
.card{animation:iosPageIn .75s cubic-bezier(.22,1,.36,1) both;}
.avatar-wrap{animation:iosPageIn .8s .06s cubic-bezier(.22,1,.36,1) both;}
.btn,a.row,.music-btn,#shareBtn{transition:transform .25s cubic-bezier(.22,1,.36,1),filter .25s ease,box-shadow .25s ease;}
.btn:active,a.row:active,.music-btn:active,#shareBtn:active{transform:scale(.96);filter:brightness(.92);}
.avatar-frame{animation:iosGlow 3s ease-in-out 1.1s infinite;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;}}

  /* iPhone-style premium motion */
  .row,.btn,.section-label,.share{will-change:transform,opacity;transition:transform .38s cubic-bezier(.22,1,.36,1),box-shadow .38s cubic-bezier(.22,1,.36,1),opacity .38s ease;}
  .row:active,.btn:active,.share:active{transform:scale(.97);}
  .avatar-frame{animation:avatarIn .8s cubic-bezier(.22,1,.36,1) both;}
  @keyframes avatarIn{from{opacity:0;transform:scale(.88) translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
  async function copyText(text){
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch(e) { return false; }
  }

  document.getElementById('shareBtn').addEventListener('click', async () => {
    if (navigator.share) {
      try { await navigator.share({ title:'Nuriddin Salimov', text:'My digital profile', url:location.href }); } catch(e) {}
    } else {
      const ok = await copyText(location.href);
      alert(ok ? 'Link copied!' : 'Sharing is not available here.');
    }
  });
  const music = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');

  musicBtn.addEventListener('click', async () => {
    try {
      if (music.paused) {
        await music.play();
        musicBtn.classList.add('playing');
        musicBtn.setAttribute('aria-label', 'Pause music');
        musicBtn.querySelector('.note').textContent = '♫';
      } else {
        music.pause();
        musicBtn.classList.remove('playing');
        musicBtn.setAttribute('aria-label', 'Play music');
        musicBtn.querySelector('.note').textContent = '♪';
      }
    } catch (err) {
      alert('Musiqani ijro etib bo‘lmadi.');
    }
  });

  music.addEventListener('pause', () => {
    musicBtn.classList.remove('playing');
    musicBtn.querySelector('.note').textContent = '♪';
  });
  music.addEventListener('play', () => {
    musicBtn.classList.add('playing');
    musicBtn.querySelector('.note').textContent = '♫';
  });

</script>

    requestAnimationFrame(()=>{el.style.opacity='1'; el.style.transform='none';});

});
</script>
